name: CI

# Builds, lints and tests this workspace against a truce checkout. The
# examples are workspace members with their format features on by
# default, so a plugin that stops compiling through an out-of-tree
# format (truce-example-gui-zoo-lv2 for LV2) fails every job below.
#
# Runs nightly as well as on change: this repo depends on truce and
# nothing in truce depends on it, so a truce change that breaks it would
# otherwise go unnoticed until the next commit here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      truce_ref:
        description: "truce branch, tag or commit to build against"
        required: false

env:
  # The truce development line this repo's major.minor tracks. Move it
  # with each truce release branch.
  TRUCE_REF: dev/v7.0.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: truce-extensions

    steps:
      # The truce dependencies are `../truce` paths, so the two
      # checkouts have to be siblings.
      - uses: actions/checkout@v4
        with:
          path: truce-extensions

      - uses: actions/checkout@v4
        with:
          repository: truce-audio/truce
          ref: ${{ inputs.truce_ref || env.TRUCE_REF }}
          path: truce

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: truce-extensions
          key: ${{ matrix.os }}
          cache-bin: false

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: scripts/ci/install-linux-deps.sh

      # Before truce cuts the release this repo tracks, its checkout still
      # carries the previous version; see the script.
      - name: Align truce version
        run: scripts/align-truce.sh

      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace

  # Builds LV2 bundles the way a plug-in author does and checks them the way
  # a host sees them (scripts/ci/lv2-check.sh: lv2_validate against the LV2
  # spec, lilv discovery, then instantiate and run): the example, which also
  # has to pass audio through unchanged, and an effect and an instrument
  # freshly scaffolded with `cargo truce new` and given LV2 as the
  # scaffold's own comment says to (scripts/ci/lv2-scaffold.sh). Linux and
  # macOS, where lilv installs from the system package manager; the check
  # job above still builds the LV2 crates on Windows.
  lv2:
    name: lv2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: truce-extensions

    steps:
      - uses: actions/checkout@v4
        with:
          path: truce-extensions

      - uses: actions/checkout@v4
        with:
          repository: truce-audio/truce
          ref: ${{ inputs.truce_ref || env.TRUCE_REF }}
          path: truce

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: truce-extensions
          key: lv2-${{ matrix.os }}
          cache-bin: false

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: scripts/ci/install-linux-deps.sh --lv2

      - name: macOS system deps
        if: runner.os == 'macOS'
        run: brew install lilv

      - name: Align truce version
        run: scripts/align-truce.sh

      # cargo truce from the truce checkout, the LV2 helper from this one.
      - name: Build cargo-truce and truce-format-lv2
        run: |
          cargo build -p truce-format-lv2
          cargo build --manifest-path ../truce/Cargo.toml -p cargo-truce
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
          echo "$(cd ../truce && pwd)/target/debug" >> "$GITHUB_PATH"

      - name: Example bundle
        run: |
          cargo truce build --lv2 --debug -p truce-example-gui-zoo-lv2
          scripts/ci/lv2-check.sh --passthrough target/bundles/truce-gui-zoo-lv2.lv2

      - name: Scaffolded bundles
        run: |
          scripts/ci/lv2-scaffold.sh "$RUNNER_TEMP/lv2-scaffold" > "$RUNNER_TEMP/lv2-bundles.txt"
          xargs scripts/ci/lv2-check.sh < "$RUNNER_TEMP/lv2-bundles.txt"
